# Test Profile Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.thymeleaf.cache=false

app.upload.dir=target/test-uploads
app.ai.gemini.api-key=
app.library.max-books-per-student=3
app.library.default-borrow-days=14
app.library.fine-per-day=1.00
