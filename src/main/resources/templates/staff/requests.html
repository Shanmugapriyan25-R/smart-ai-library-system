<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('Manage Issue Requests')}"></head>
<body>
    <nav th:replace="~{common/layout :: navbar}"></nav>
    <div class="app-container">
        <aside th:replace="~{common/layout :: sidebar('staff-requests')}"></aside>
        <main class="main-content">
            <!-- Flash Message Alerts -->
            <div th:replace="~{common/layout :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1">Student Issue Requests</h2>
                    <p class="text-muted mb-0">Approve or reject student book loan requests submitted online.</p>
                </div>
                <a th:href="@{/staff/direct-issue}" class="btn btn-primary rounded-pill px-3">
                    <i class="bi bi-journal-plus me-1"></i> Direct In-Person Issue
                </a>
            </div>

            <div class="card card-custom">
                <div class="card-body p-0">
                    <div class="table-responsive" th:if="${requests.totalElements > 0}">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Student Details</th>
                                    <th>Book Details</th>
                                    <th>Stock</th>
                                    <th>Request Date</th>
                                    <th>Remarks</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="req : ${requests.content}">
                                    <td>
                                        <div class="fw-semibold text-dark" th:text="${req.user.fullName}">Name</div>
                                        <div class="small text-muted" th:text="${req.user.email}">Email</div>
                                    </td>
                                    <td>
                                        <div class="fw-semibold text-dark" th:text="${req.book.title}">Title</div>
                                        <div class="small text-muted" th:text="'ISBN: ' + ${req.book.isbn}">ISBN</div>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${req.book.availableCopies > 0} ? 'bg-success' : 'bg-danger'"
                                              th:text="${req.book.availableCopies} + ' / ' + ${req.book.totalCopies}">Copies</span>
                                    </td>
                                    <td class="small text-muted" th:text="${#temporals.format(req.requestDate, 'dd MMM yyyy, HH:mm')}">Date</td>
                                    <td class="small text-muted" th:text="${req.remarks ?: '-'}">-</td>
                                    <td class="text-end">
                                        <form th:action="@{/staff/approve-request/{id}(id=${req.id})}" method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-success rounded-pill px-3 me-1" th:disabled="${req.book.availableCopies <= 0}">
                                                <i class="bi bi-check-lg me-1"></i> Approve
                                            </button>
                                        </form>
                                        <form th:action="@{/staff/reject-request/{id}(id=${req.id})}" method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                                                <i class="bi bi-x-lg me-1"></i> Reject
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:if="${requests.totalElements == 0}" class="p-5 text-center text-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                        <h5 class="fw-bold text-dark">No Pending Requests</h5>
                        <p class="mb-0">All student book loan requests have been reviewed.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
