<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('Student Records')}"></head>
<body>
    <nav th:replace="~{common/layout :: navbar}"></nav>
    <div class="app-container">
        <aside th:replace="~{common/layout :: sidebar('staff-students')}"></aside>
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1">Student Records & Borrower Directory</h2>
                    <p class="text-muted mb-0">Search registered student accounts, emails, contact info, and status.</p>
                </div>
            </div>

            <!-- Search Form -->
            <div class="card card-custom p-3 mb-4 bg-white">
                <form th:action="@{/staff/students}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-10">
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="query" class="form-control" placeholder="Search by student name, username, or email..." th:value="${query}">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Search Students</button>
                    </div>
                </form>
            </div>

            <div class="card card-custom">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Username</th>
                                    <th>Full Name</th>
                                    <th>Email Address</th>
                                    <th>Phone</th>
                                    <th>Account Status</th>
                                    <th>Joined</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="st : ${students}">
                                    <td><span class="badge bg-light text-dark border" th:text="${st.username}">Username</span></td>
                                    <td class="fw-semibold text-dark" th:text="${st.fullName}">Full Name</td>
                                    <td th:text="${st.email}">Email</td>
                                    <td th:text="${st.phone ?: '-'}">Phone</td>
                                    <td>
                                        <span class="badge" th:classappend="${st.status == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'" th:text="${st.status}">ACTIVE</span>
                                    </td>
                                    <td class="small text-muted" th:text="${#temporals.format(st.createdAt, 'dd MMM yyyy')}">Date</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
