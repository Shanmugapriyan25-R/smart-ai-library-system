<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('Direct In-Person Book Issue')}"></head>
<body>
    <nav th:replace="~{common/layout :: navbar}"></nav>
    <div class="app-container">
        <aside th:replace="~{common/layout :: sidebar('staff-direct')}"></aside>
        <main class="main-content">
            <!-- Flash Message Alerts -->
            <div th:replace="~{common/layout :: alerts}"></div>

            <div class="mb-4">
                <h2 class="fw-bold text-dark mb-1">Direct Over-The-Counter Issue</h2>
                <p class="text-muted mb-0">Directly check out a physical volume to a student present at the circulation desk.</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card card-custom p-4">
                        <form th:action="@{/staff/direct-issue}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="mb-3">
                                <label for="studentId" class="form-label small fw-semibold text-secondary">Select Student</label>
                                <select name="studentId" id="studentId" class="form-select" required>
                                    <option value="">-- Choose Student Account --</option>
                                    <option th:each="st : ${students}" th:value="${st.id}"
                                            th:text="${st.fullName} + ' (' + ${st.username} + ' - ' + ${st.email} + ')'"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="bookId" class="form-label small fw-semibold text-secondary">Select Book to Issue</label>
                                <select name="bookId" id="bookId" class="form-select" required>
                                    <option value="">-- Choose Book from Available Inventory --</option>
                                    <option th:each="b : ${books}" th:value="${b.id}"
                                            th:text="${b.title} + ' by ' + ${b.author} + ' (Copies: ' + ${b.availableCopies} + ', Shelf: ' + (${b.locationShelf ?: 'Main'}) + ')'"></option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="remarks" class="form-label small fw-semibold text-secondary">Circulation Notes / Condition</label>
                                <textarea name="remarks" id="remarks" rows="2" class="form-control" placeholder="e.g. Standard 14-day checkout; book in pristine condition"></textarea>
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <a th:href="@{/staff/requests}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold">
                                    <i class="bi bi-box-arrow-up-right me-1"></i> Issue Book Now
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
