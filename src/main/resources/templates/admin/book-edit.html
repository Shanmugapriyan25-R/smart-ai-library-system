<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('Edit Book')}"></head>
<body>
    <nav th:replace="~{common/layout :: navbar}"></nav>
    <div class="app-container">
        <aside th:replace="~{common/layout :: sidebar('admin-books')}"></aside>
        <main class="main-content">
            <div class="mb-4">
                <a th:href="@{/admin/books}" class="text-muted text-decoration-none small">
                    <i class="bi bi-arrow-left me-1"></i> Back to Books Catalogue
                </a>
                <h2 class="fw-bold text-dark mt-2 mb-1">Edit Book: <span class="text-primary" th:text="${bookDto.title}">Book Title</span></h2>
                <p class="text-muted mb-0">Update book metadata, stock copies, and shelving location.</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-9">
                    <div class="card card-custom p-4">
                        <form th:action="@{/admin/books/edit/{id}(id=${bookDto.id})}" th:object="${bookDto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" th:field="*{id}" />

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="isbn" class="form-label small fw-semibold text-secondary">ISBN-13</label>
                                    <input type="text" th:field="*{isbn}" class="form-control" id="isbn" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="categoryId" class="form-label small fw-semibold text-secondary">Category</label>
                                    <select th:field="*{categoryId}" class="form-select" id="categoryId" required>
                                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="title" class="form-label small fw-semibold text-secondary">Book Title</label>
                                <input type="text" th:field="*{title}" class="form-control" id="title" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="author" class="form-label small fw-semibold text-secondary">Author(s)</label>
                                <input type="text" th:field="*{author}" class="form-control" id="author" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label for="publisher" class="form-label small fw-semibold text-secondary">Publisher</label>
                                    <input type="text" th:field="*{publisher}" class="form-control" id="publisher">
                                </div>
                                <div class="col-md-4">
                                    <label for="publicationYear" class="form-label small fw-semibold text-secondary">Publication Year</label>
                                    <input type="number" th:field="*{publicationYear}" class="form-control" id="publicationYear">
                                </div>
                                <div class="col-md-4">
                                    <label for="edition" class="form-label small fw-semibold text-secondary">Edition</label>
                                    <input type="text" th:field="*{edition}" class="form-control" id="edition">
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label for="totalCopies" class="form-label small fw-semibold text-secondary">Total Physical Copies</label>
                                    <input type="number" th:field="*{totalCopies}" class="form-control" id="totalCopies" min="1" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold text-secondary">Available Copies</label>
                                    <input type="number" class="form-control bg-light" th:value="*{availableCopies}" disabled title="Calculated automatically based on active loans">
                                </div>
                                <div class="col-md-4">
                                    <label for="locationShelf" class="form-label small fw-semibold text-secondary">Physical Shelf Location</label>
                                    <input type="text" th:field="*{locationShelf}" class="form-control" id="locationShelf">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="description" class="form-label small fw-semibold text-secondary">Description & Abstract</label>
                                <textarea th:field="*{description}" id="description" rows="3" class="form-control"></textarea>
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <a th:href="@{/admin/books}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold">
                                    <i class="bi bi-save me-1"></i> Update Book
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
