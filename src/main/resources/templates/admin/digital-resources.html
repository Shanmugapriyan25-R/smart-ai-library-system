<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('Manage Digital Resources')}"></head>
<body>
    <nav th:replace="~{common/layout :: navbar}"></nav>
    <div class="app-container">
        <aside th:replace="~{common/layout :: sidebar('admin-digital')}"></aside>
        <main class="main-content">
            <!-- Flash Message Alerts -->
            <div th:replace="~{common/layout :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1">Digital Resource Management & PDF Indexing</h2>
                    <p class="text-muted mb-0">Upload documents to the institutional archive and generate vector chunks for RAG AI retrieval.</p>
                </div>
            </div>

            <div class="row g-4">
                <!-- Upload PDF Form -->
                <div class="col-lg-4">
                    <div class="card card-custom p-4 shadow-sm">
                        <h5 class="fw-bold text-dark mb-3"><i class="bi bi-cloud-arrow-up me-2 text-primary"></i> Upload PDF Document</h5>
                        <form th:action="@{/admin/digital-resources/upload}" method="post" enctype="multipart/form-data">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="mb-3">
                                <label for="file" class="form-label small fw-semibold text-secondary">PDF File (*.pdf only)</label>
                                <input type="file" name="file" id="file" class="form-control" accept=".pdf" required>
                            </div>

                            <div class="mb-3">
                                <label for="title" class="form-label small fw-semibold text-secondary">Document Title</label>
                                <input type="text" name="title" id="title" class="form-control" required placeholder="Handbook / Paper Title">
                            </div>

                            <div class="mb-3">
                                <label for="author" class="form-label small fw-semibold text-secondary">Author / Institution</label>
                                <input type="text" name="author" id="author" class="form-control" placeholder="e.g. IEEE / Academic Faculty">
                            </div>

                            <div class="mb-3">
                                <label for="categoryId" class="form-label small fw-semibold text-secondary">Discipline Category</label>
                                <select name="categoryId" id="categoryId" class="form-select">
                                    <option value="">-- General Archive --</option>
                                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="accessLevel" class="form-label small fw-semibold text-secondary">Permission Access Level</label>
                                <select name="accessLevel" id="accessLevel" class="form-select">
                                    <option value="STUDENT">STUDENT (All Portal Users)</option>
                                    <option value="STAFF">STAFF (Staff & Admins Only)</option>
                                    <option value="ADMIN">ADMIN (Administrative Only)</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="description" class="form-label small fw-semibold text-secondary">Description</label>
                                <textarea name="description" id="description" rows="2" class="form-control" placeholder="Abstract / notes..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill">
                                <i class="bi bi-upload me-1"></i> Upload & Vector Index
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Existing Resources Table -->
                <div class="col-lg-8">
                    <div class="card card-custom">
                        <div class="card-header fw-bold text-dark">
                            Institutional Digital Archive
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive" th:if="${not #lists.isEmpty(resources)}">
                                <table class="table table-hover mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Title</th>
                                            <th>Author</th>
                                            <th>Access Level</th>
                                            <th>Size</th>
                                            <th class="text-end">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="r : ${resources}">
                                            <td>
                                                <div class="fw-semibold text-dark">
                                                    <i class="bi bi-file-earmark-pdf text-danger me-1"></i>
                                                    <span th:text="${r.title}">Title</span>
                                                </div>
                                                <div class="small text-muted" th:text="${r.fileName}">file.pdf</div>
                                            </td>
                                            <td th:text="${r.author ?: 'Faculty'}">Author</td>
                                            <td>
                                                <span class="badge"
                                                      th:classappend="${r.accessLevel == 'STUDENT'} ? 'bg-primary' :
                                                                     (${r.accessLevel == 'STAFF'} ? 'bg-warning text-dark' : 'bg-danger')"
                                                      th:text="${r.accessLevel}">Level</span>
                                            </td>
                                            <td class="small text-muted" th:text="${#numbers.formatDecimal(r.fileSize / 1024.0, 1, 1)} + ' KB'">Size</td>
                                            <td class="text-end">
                                                <form th:action="@{/admin/digital-resources/delete/{id}(id=${r.id})}" method="post" class="d-inline">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                    <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-2"
                                                            onclick="return confirm('Delete this digital resource and remove its chunks from the RAG index?');">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div th:if="${#lists.isEmpty(resources)}" class="p-5 text-center text-muted">
                                No digital resources uploaded yet.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
