<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('Admin Catalogue & Book Management')}"></head>
<body>
    <nav th:replace="~{common/layout :: navbar}"></nav>
    <div class="app-container">
        <aside th:replace="~{common/layout :: sidebar('admin-books')}"></aside>
        <main class="main-content">
            <!-- Flash Message Alerts -->
            <div th:replace="~{common/layout :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1">Book Catalogue Administration</h2>
                    <p class="text-muted mb-0">Manage volumes, adjust physical inventory, modify shelving locations, and archive titles.</p>
                </div>
                <a th:href="@{/admin/books/create}" class="btn btn-primary rounded-pill px-3">
                    <i class="bi bi-plus-circle me-1"></i> Add New Book
                </a>
            </div>

            <!-- Filter and Search -->
            <div class="card card-custom p-3 mb-4 bg-white">
                <form th:action="@{/admin/books}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="query" class="form-control" placeholder="Search by title, author, ISBN..." th:value="${query}">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select name="category" class="form-select" onchange="this.form.submit()">
                            <option value="">All Categories</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == selectedCategory}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Filter Books</button>
                    </div>
                </form>
            </div>

            <!-- Books Table -->
            <div class="card card-custom">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ISBN</th>
                                    <th>Title & Author</th>
                                    <th>Category</th>
                                    <th>Shelf</th>
                                    <th>Available / Total</th>
                                    <th>Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="b : ${books.content}">
                                    <td><span class="badge bg-light text-dark border" th:text="${b.isbn}">ISBN</span></td>
                                    <td>
                                        <div class="fw-semibold text-dark" th:text="${b.title}">Title</div>
                                        <div class="small text-muted" th:text="${b.author}">Author</div>
                                    </td>
                                    <td th:text="${b.category.name}">Category</td>
                                    <td><span class="badge bg-light text-primary border" th:text="${b.locationShelf ?: 'Main Stacks'}">Shelf</span></td>
                                    <td>
                                        <strong th:text="${b.availableCopies}">0</strong> / <span th:text="${b.totalCopies}">0</span>
                                    </td>
                                    <td>
                                        <span th:if="${b.isArchived}" class="badge bg-secondary">Archived</span>
                                        <span th:unless="${b.isArchived}" th:classappend="${b.availableCopies > 0} ? 'badge bg-success' : 'badge bg-danger'"
                                              th:text="${b.availableCopies > 0} ? 'Active Stock' : 'Out of Stock'">Active</span>
                                    </td>
                                    <td class="text-end">
                                        <a th:href="@{/admin/books/edit/{id}(id=${b.id})}" class="btn btn-sm btn-outline-primary rounded-pill me-1">
                                            <i class="bi bi-pencil"></i> Edit
                                        </a>
                                        <form th:if="${!b.isArchived}" th:action="@{/admin/books/archive/{id}(id=${b.id})}" method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-outline-warning rounded-pill" onclick="return confirm('Archive this book title?');">
                                                Archive
                                            </button>
                                        </form>
                                        <form th:if="${b.isArchived}" th:action="@{/admin/books/restore/{id}(id=${b.id})}" method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-outline-success rounded-pill">
                                                Restore
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
