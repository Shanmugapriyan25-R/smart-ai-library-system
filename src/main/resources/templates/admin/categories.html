<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('Manage Categories')}"></head>
<body>
    <nav th:replace="~{common/layout :: navbar}"></nav>
    <div class="app-container">
        <aside th:replace="~{common/layout :: sidebar('admin-categories')}"></aside>
        <main class="main-content">
            <!-- Flash Message Alerts -->
            <div th:replace="~{common/layout :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1">Library Subject Categories</h2>
                    <p class="text-muted mb-0">Define academic disciplines and classification taxonomies.</p>
                </div>
            </div>

            <div class="row g-4">
                <!-- Create Category Column -->
                <div class="col-lg-4">
                    <div class="card card-custom p-4 shadow-sm">
                        <h5 class="fw-bold text-dark mb-3"><i class="bi bi-tag me-2 text-primary"></i> Create Category</h5>
                        <form th:action="@{/admin/categories/create}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="mb-3">
                                <label for="name" class="form-label small fw-semibold text-secondary">Category Name</label>
                                <input type="text" name="name" id="name" class="form-control" required placeholder="e.g. Biomedical Engineering">
                            </div>

                            <div class="mb-3">
                                <label for="code" class="form-label small fw-semibold text-secondary">Category Code</label>
                                <input type="text" name="code" id="code" class="form-control" required placeholder="e.g. BIO-MED">
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label small fw-semibold text-secondary">Description</label>
                                <textarea name="description" id="description" rows="3" class="form-control" placeholder="Discipline overview..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill">
                                <i class="bi bi-plus-circle me-1"></i> Add Category
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Existing Categories Table -->
                <div class="col-lg-8">
                    <div class="card card-custom">
                        <div class="card-header fw-bold text-dark">
                            Current Library Categories
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Code</th>
                                            <th>Name</th>
                                            <th>Description</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="cat : ${categories}">
                                            <td><span class="badge bg-light text-primary border fw-bold" th:text="${cat.code}">CODE</span></td>
                                            <td class="fw-semibold text-dark" th:text="${cat.name}">Category Name</td>
                                            <td class="small text-muted" th:text="${cat.description ?: '-'}">Description</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
