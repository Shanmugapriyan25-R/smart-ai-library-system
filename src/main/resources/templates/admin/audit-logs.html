<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('System Audit Trail')}"></head>
<body>
    <nav th:replace="~{common/layout :: navbar}"></nav>
    <div class="app-container">
        <aside th:replace="~{common/layout :: sidebar('admin-audit')}"></aside>
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1">System Audit Trail & Security Logs</h2>
                    <p class="text-muted mb-0">Immutable records of administrative operations, policy changes, and security events.</p>
                </div>
            </div>

            <!-- Search Form -->
            <div class="card card-custom p-3 mb-4 bg-white">
                <form th:action="@{/admin/audit-logs}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-10">
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="query" class="form-control" placeholder="Search by username, action, entity, details..." th:value="${query}">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Filter Logs</button>
                    </div>
                </form>
            </div>

            <div class="card card-custom">
                <div class="card-body p-0">
                    <div class="table-responsive" th:if="${logs.totalElements > 0}">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Actor</th>
                                    <th>Action</th>
                                    <th>Entity</th>
                                    <th>Details</th>
                                    <th>IP Address</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="l : ${logs.content}">
                                    <td class="small text-muted" th:text="${#temporals.format(l.createdAt, 'dd MMM yyyy, HH:mm:ss')}">Time</td>
                                    <td><span class="badge bg-light text-dark border fw-bold" th:text="${l.username}">User</span></td>
                                    <td><span class="badge bg-primary-light text-primary" th:text="${l.action}">ACTION</span></td>
                                    <td class="small fw-semibold text-secondary" th:text="${l.entityName} + ' #' + (${l.entityId ?: '-'})">Entity</td>
                                    <td class="small text-dark" th:text="${l.details}">Details</td>
                                    <td class="small text-muted font-monospace" th:text="${l.ipAddress}">IP</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:if="${logs.totalElements == 0}" class="p-5 text-center text-muted">
                        No audit records matched your search query.
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
