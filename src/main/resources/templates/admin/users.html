<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('User Account Management')}"></head>
<body>
    <nav th:replace="~{common/layout :: navbar}"></nav>
    <div class="app-container">
        <aside th:replace="~{common/layout :: sidebar('admin-users')}"></aside>
        <main class="main-content">
            <!-- Flash Message Alerts -->
            <div th:replace="~{common/layout :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1">User & Role Management</h2>
                    <p class="text-muted mb-0">Create, edit, suspend, and configure permissions for students, staff, and administrators.</p>
                </div>
                <a th:href="@{/admin/users/create}" class="btn btn-primary rounded-pill px-3">
                    <i class="bi bi-person-plus me-1"></i> Create Account
                </a>
            </div>

            <!-- Filter and Search Bar -->
            <div class="card card-custom p-3 mb-4 bg-white">
                <form th:action="@{/admin/users}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="query" class="form-control" placeholder="Search by username, name, or email..." th:value="${query}">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select name="role" class="form-select" onchange="this.form.submit()">
                            <option value="">All Portal Roles</option>
                            <option value="ROLE_STUDENT" th:selected="${selectedRole == 'ROLE_STUDENT'}">Students</option>
                            <option value="ROLE_STAFF" th:selected="${selectedRole == 'ROLE_STAFF'}">Library Staff</option>
                            <option value="ROLE_ADMIN" th:selected="${selectedRole == 'ROLE_ADMIN'}">Administrators</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Filter</button>
                    </div>
                </form>
            </div>

            <!-- Users Table -->
            <div class="card card-custom">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Username</th>
                                    <th>Full Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Account Status</th>
                                    <th>Joined</th>
                                    <th class="text-end">Manage</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="u : ${users}">
                                    <td class="text-muted small" th:text="'#' + ${u.id}">#1</td>
                                    <td><span class="badge bg-light text-dark border fw-bold" th:text="${u.username}">user</span></td>
                                    <td class="fw-semibold text-dark" th:text="${u.fullName}">Full Name</td>
                                    <td th:text="${u.email}">Email</td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${u.role.name() == 'ROLE_ADMIN'} ? 'bg-danger' :
                                                             (${u.role.name() == 'ROLE_STAFF'} ? 'bg-warning text-dark' : 'bg-primary')"
                                              th:text="${u.role.displayRole}">Role</span>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${u.status == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'" th:text="${u.status}">ACTIVE</span>
                                    </td>
                                    <td class="small text-muted" th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}">Date</td>
                                    <td class="text-end">
                                        <a th:href="@{/admin/users/edit/{id}(id=${u.id})}" class="btn btn-sm btn-outline-primary rounded-pill me-1">
                                            <i class="bi bi-pencil"></i> Edit
                                        </a>
                                        <form th:action="@{/admin/users/toggle-status/{id}(id=${u.id})}" method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm rounded-pill"
                                                    th:classappend="${u.status == 'ACTIVE'} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                    onclick="return confirm('Toggle status for this account?');">
                                                <span th:text="${u.status == 'ACTIVE'} ? 'Suspend' : 'Activate'">Action</span>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
