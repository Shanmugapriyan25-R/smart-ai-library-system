<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('Portal Sign In')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 480px;">
        <div class="text-center mb-4">
            <a th:href="@{/}" class="text-decoration-none">
                <i class="bi bi-book-half text-primary fs-1"></i>
                <h3 class="fw-bold text-dark mt-2">Smart Library System</h3>
            </a>
            <span class="badge bg-primary-light text-primary px-3 py-1 rounded-pill fw-semibold">
                Portal Authentication
            </span>
        </div>

        <div class="card card-custom p-4 shadow-sm">
            <!-- Portal Switching Tabs -->
            <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-pill" id="portalTabs">
                <li class="nav-item">
                    <a class="nav-link rounded-pill text-dark" th:classappend="${portal == 'student' or portal == null} ? 'active bg-primary text-white' : ''"
                       th:href="@{/login?portal=student}">Student</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded-pill text-dark" th:classappend="${portal == 'staff'} ? 'active bg-teal text-white' : ''"
                       th:href="@{/login?portal=staff}">Staff</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded-pill text-dark" th:classappend="${portal == 'admin'} ? 'active bg-dark text-white' : ''"
                       th:href="@{/login?portal=admin}">Admin</a>
                </li>
            </ul>

            <!-- Alerts -->
            <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success py-2 px-3 small" th:text="${successMessage}"></div>

            <!-- Login Form -->
            <form th:action="@{/login-process}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-secondary">Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="Enter your username">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill mt-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>

            <!-- Quick Demo Credentials Box -->
            <div class="mt-4 pt-3 border-top">
                <div class="small fw-bold text-muted mb-2 text-center text-uppercase" style="letter-spacing: 0.5px;">
                    Demo Account Quick-Fill
                </div>
                <div class="d-flex flex-wrap gap-2 justify-content-center">
                    <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-2"
                            onclick="fillCredentials('student', 'student123')">
                        <i class="bi bi-mortarboard me-1"></i> Student
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-teal rounded-pill px-2"
                            onclick="fillCredentials('staff', 'staff123')">
                        <i class="bi bi-person-workspace me-1"></i> Staff
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-dark rounded-pill px-2"
                            onclick="fillCredentials('admin', 'admin123')">
                        <i class="bi bi-shield-lock me-1"></i> Admin
                    </button>
                </div>
            </div>
        </div>

        <div class="text-center mt-3">
            <span class="text-muted small">New student?</span>
            <a th:href="@{/register}" class="text-primary small fw-semibold text-decoration-none ms-1">Register for an account</a>
        </div>
    </div>

    <script>
        function fillCredentials(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }
    </script>
</body>
</html>
