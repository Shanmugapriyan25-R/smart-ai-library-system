<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('Digital Document Archive')}"></head>
<body>
    <nav th:replace="~{common/layout :: navbar}"></nav>
    <div class="app-container">
        <aside th:replace="~{common/layout :: sidebar('digital-reader')}"></aside>
        <main class="main-content">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1">Digital Document Library</h2>
                    <p class="text-muted mb-0">Read peer-reviewed handbooks, lecture notes, and research PDFs online.</p>
                </div>
            </div>

            <!-- Search Form -->
            <div class="card card-custom p-3 mb-4 bg-white">
                <form th:action="@{/student/digital-reader}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-10">
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="query" class="form-control" placeholder="Search digital papers, handbooks, monographs..." th:value="${query}">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Search PDFs</button>
                    </div>
                </form>
            </div>

            <!-- Documents Grid -->
            <div class="row g-4" th:if="${resources.totalElements > 0}">
                <div class="col-md-6" th:each="res : ${resources.content}">
                    <div class="card card-custom h-100 p-3">
                        <div class="d-flex align-items-start gap-3">
                            <div class="stat-icon red bg-danger-subtle text-danger" style="width: 50px; height: 50px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                                <i class="bi bi-file-earmark-pdf-fill"></i>
                            </div>
                            <div class="flex-grow-1">
                                <h5 class="fw-bold text-dark mb-1" th:text="${res.title}">Document Title</h5>
                                <div class="small text-muted mb-2">
                                    Author: <span th:text="${res.author ?: 'Library Board'}">Author</span> &bull;
                                    Size: <span th:text="${#numbers.formatDecimal(res.fileSize / 1024.0, 1, 1)} + ' KB'">Size</span>
                                </div>
                                <p class="small text-secondary mb-3" th:text="${res.description ?: 'Digital document uploaded to the library institutional repository.'}">
                                    Description
                                </p>
                                <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                                    <span class="badge bg-light text-muted border" th:text="${res.category != null ? res.category.name : 'General Archive'}">Category</span>
                                    <a th:href="@{/student/digital-reader/view/{id}(id=${res.id})}" class="btn btn-sm btn-primary rounded-pill px-3">
                                        <i class="bi bi-book-half me-1"></i> Open Reader
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div class="card card-custom p-5 text-center my-4" th:if="${resources.totalElements == 0}">
                <i class="bi bi-file-earmark-x fs-1 text-muted d-block mb-3"></i>
                <h5 class="fw-bold text-dark">No Digital Documents Found</h5>
                <p class="text-muted">No digital documents are currently accessible for your query.</p>
            </div>
        </main>
    </div>
</body>
</html>
