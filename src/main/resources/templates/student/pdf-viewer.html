<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{common/layout :: head(${resource.title} + ' - Digital Reader')}"></th:block>
    <!-- PDF.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-light">
    <!-- Reader Header -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top py-2">
        <div class="container-fluid px-3">
            <a th:href="@{/student/digital-reader}" class="btn btn-sm btn-outline-secondary rounded-pill me-3">
                <i class="bi bi-arrow-left me-1"></i> Exit Reader
            </a>
            <div class="fw-bold text-dark text-truncate me-auto" style="max-width: 500px;" th:text="${resource.title}">
                Document Title
            </div>

            <!-- PDF Controls Toolbar -->
            <div class="d-flex align-items-center gap-2">
                <button type="button" id="pdf-prev" class="btn btn-sm btn-outline-secondary" title="Previous Page">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <div class="d-flex align-items-center small text-muted">
                    Page
                    <input type="number" id="pdf-page-num" min="1" class="form-control form-control-sm text-center mx-1" style="width: 55px;" th:value="${lastPage}">
                    of <span id="pdf-page-count" class="ms-1">-</span>
                </div>
                <button type="button" id="pdf-next" class="btn btn-sm btn-outline-secondary" title="Next Page">
                    <i class="bi bi-chevron-right"></i>
                </button>

                <div class="vr mx-2"></div>

                <button type="button" id="pdf-zoom-out" class="btn btn-sm btn-outline-secondary" title="Zoom Out">
                    <i class="bi bi-zoom-out"></i>
                </button>
                <button type="button" id="pdf-zoom-in" class="btn btn-sm btn-outline-secondary" title="Zoom In">
                    <i class="bi bi-zoom-in"></i>
                </button>

                <button type="button" id="pdf-save-progress" class="btn btn-sm btn-teal ms-2 rounded-pill px-3">
                    <i class="bi bi-bookmark-check me-1"></i> Bookmark
                </button>
            </div>
        </div>
    </nav>

    <!-- Document Viewer Canvas Area -->
    <div class="container my-4 text-center" id="pdf-render-container">
        <div class="card card-custom p-3 shadow-sm d-inline-block mx-auto" style="background-color: #525659;">
            <canvas id="pdf-canvas"
                    th:data-resource-id="${resource.id}"
                    th:data-initial-page="${lastPage}"
                    class="shadow bg-white rounded"></canvas>
        </div>
    </div>

    <!-- Page Scripts -->
    <script th:src="@{/js/pdf-viewer.js}"></script>
</body>
</html>
