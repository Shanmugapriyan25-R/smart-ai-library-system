<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('Profile Settings')}"></head>
<body>
    <nav th:replace="~{common/layout :: navbar}"></nav>
    <div class="app-container">
        <aside th:replace="~{common/layout :: sidebar('profile')}"></aside>
        <main class="main-content">
            <!-- Flash Message Alerts -->
            <div th:replace="~{common/layout :: alerts}"></div>

            <div class="mb-4">
                <h2 class="fw-bold text-dark mb-1">Student Profile & Security</h2>
                <p class="text-muted mb-0">Update your verified contact information and portal password.</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card card-custom p-4">
                        <form th:action="@{/student/profile}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Username (Immutable)</label>
                                    <input type="text" class="form-control bg-light" th:value="${user.username}" disabled>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Assigned Portal Role</label>
                                    <input type="text" class="form-control bg-light" th:value="${user.role.displayRole}" disabled>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="fullName" class="form-label small fw-semibold text-secondary">Full Name</label>
                                <input type="text" name="fullName" id="fullName" class="form-control" th:value="${user.fullName}" required>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="email" class="form-label small fw-semibold text-secondary">Email Address</label>
                                    <input type="email" name="email" id="email" class="form-control" th:value="${user.email}" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label small fw-semibold text-secondary">Phone Number</label>
                                    <input type="tel" name="phone" id="phone" class="form-control" th:value="${user.phone}">
                                </div>
                            </div>

                            <hr class="my-4 text-muted">

                            <h5 class="fw-bold text-dark mb-2">Change Password</h5>
                            <p class="small text-muted mb-3">Leave blank if you do not want to change your current password.</p>

                            <div class="mb-4">
                                <label for="newPassword" class="form-label small fw-semibold text-secondary">New Password</label>
                                <input type="password" name="newPassword" id="newPassword" class="form-control" placeholder="Enter new password (optional)">
                            </div>

                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary px-4 rounded-pill fw-semibold">
                                    <i class="bi bi-save me-1"></i> Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
