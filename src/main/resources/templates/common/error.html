<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('System Error')}"></head>
<body>
    <nav th:replace="~{common/layout :: navbar}"></nav>
    <div class="container my-5 text-center">
        <div class="card card-custom p-5 mx-auto" style="max-width: 600px;">
            <div class="mb-4">
                <i class="bi bi-exclamation-octagon text-danger" style="font-size: 4rem;"></i>
            </div>
            <h2 class="fw-bold text-dark">Something Went Wrong</h2>
            <p class="text-muted mt-2" th:text="${error != null ? error : 'An unexpected server error occurred.'}">Error message</p>
            <div class="mt-4">
                <a th:href="@{/}" class="btn btn-primary px-4 rounded-pill">Return to Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
